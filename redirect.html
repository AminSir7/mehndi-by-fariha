<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed | Mehndi By Fariha</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background: linear-gradient(135deg, #f5edff 0%, #e9d5ff 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 40px rgba(126, 34, 206, 0.15);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 min-h-screen">
    <div class="glass-card max-w-md w-full rounded-3xl p-8 text-center space-y-6">
        <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto text-4xl shadow-inner">
            <i class="fas fa-check-circle"></i>
        </div>

        <div class="space-y-2">
            <h2 class="text-2xl font-bold text-purple-950">আপনার অর্ডারটি কনফার্ম হয়েছে!</h2>
            <p class="text-sm text-gray-600">আমাদের সাথে থাকার জন্য আপনাকে ধন্যবাদ। আমরা শীঘ্রই আপনার সাথে যোগাযোগ করবো।</p>
        </div>

        <div id="orderDetails" class="bg-white/40 rounded-2xl p-4 text-left text-sm space-y-2 text-gray-700">
            <!-- Dynamic Data Load -->
        </div>

        <a href="index.html" class="block w-full bg-purple-700 hover:bg-purple-800 text-white font-bold py-3 rounded-xl shadow-lg transition">
            হোম পেজে ফিরে যান
        </a>
    </div>

    <script>
        const data = JSON.parse(localStorage.getItem('lastOrder'));
        if (data) {
            document.getElementById('orderDetails').innerHTML = `
                <p><strong>প্রোডাক্ট:</strong> ${data.product}</p>
                <p><strong>নাম:</strong> ${data.customer.name}</p>
                <p><strong>মোবাইল:</strong> ${data.customer.mobile}</p>
                <p><strong>জেলা:</strong> ${data.customer.district}</p>
                <p><strong>সর্বমোট মূল্য:</strong> ৳ ${data.total}</p>
            `;
        }
    </script>
</body>
</html>
