<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation - Mehndi By Fariha</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #8a64d6;
            --primary-dark: #6c47b5;
            --bg-lavender: #f3effe;
            --card-bg: #ffffff;
            --text-color: #4a3e56;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-lavender);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px 25px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(138, 100, 214, 0.15);
            text-align: center;
            border: 1px solid #e2d7f8;
        }

        .success-icon {
            width: 70px;
            height: 70px;
            background: #e8dbfc;
            color: var(--primary);
            font-size: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
        }

        h2 { color: var(--primary-dark); margin-bottom: 8px; font-size: 22px; }
        p.sub { font-size: 14px; color: #7a6b8a; margin-bottom: 20px; }

        .order-summary {
            background: #faf8ff;
            border: 1px dashed #cbb8f0;
            border-radius: 12px;
            padding: 15px;
            text-align: left;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .order-summary div { margin-bottom: 8px; }
        .order-summary div:last-child { margin-bottom: 0; }

        .btn-send {
            background: linear-gradient(135deg, #9b72cf, #7b52ab);
            color: #fff;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(138, 100, 214, 0.3);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-send:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(138, 100, 214, 0.4); }

        .anim-container { display: none; margin-top: 20px; }

        .icon-anim-box {
            position: relative;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin-bottom: 15px;
        }

        .msg-icon {
            font-size: 28px;
            color: var(--primary);
            animation: bounce 1.2s infinite alternate ease-in-out;
        }

        .msg-icon.plane { animation: fly 1.5s infinite linear; }

        @keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-12px); color: #6c47b5; } }
        @keyframes fly { 0% { transform: translate(-10px, 10px); opacity: 0.3; } 50% { opacity: 1; } 100% { transform: translate(15px, -15px); opacity: 0; } }

        .progress-box {
            background: #e9e1f7;
            border-radius: 20px;
            height: 18px;
            width: 100%;
            overflow: hidden;
        }

        .progress-bar {
            background: linear-gradient(90deg, #8a64d6, #5c35a6);
            height: 100%;
            width: 0%;
            transition: width 0.1s ease;
            border-radius: 20px;
        }

        .progress-text { font-size: 13px; font-weight: bold; color: var(--primary-dark); margin-top: 8px; }
        .sent-success-msg { display: none; color: #2e7d32; font-weight: 600; margin-top: 15px; font-size: 15px; }
    </style>
</head>
<body>

<div class="card">
    <div class="success-icon"><i class="fa-solid fa-check"></i></div>
    <h2>অর্ডার সফল হয়েছে!</h2>
    <p class="sub">আপনার অর্ডারটি নিশ্চিত করতে নিচের বাটনে ক্লিক করুন</p>

    <div class="order-summary" id="summaryBox"></div>

    <button id="sendAdminBtn" class="btn-send" onclick="startSendingProcess()">
        <i class="fa-paper-plane fa-regular"></i> আপনার অর্ডারটি এডমিনের কাছে পাঠান
    </button>

    <div class="anim-container" id="animBox">
        <div class="icon-anim-box">
            <i class="fa-solid fa-envelope-open-text msg-icon"></i>
            <i class="fa-solid fa-paper-plane msg-icon plane"></i>
        </div>
        <div class="progress-box">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="progress-text" id="progressText">0%</div>
    </div>

    <div class="sent-success-msg" id="sentMsg">
        <i class="fa-solid fa-circle-check"></i> এডমিনের কাছে সফলভাবে অর্ডারটি পাঠানো হয়েছে!
    </div>
</div>

<script>
    // 'আপনার অর্ডারটি এডমিনের কাছে পাঠান' বাটনের ক্লিক ইভেন্ট
document.getElementById('sendAdminBtn').addEventListener('click', function() {
  const btn = this;
  btn.innerText = "পাঠানো হচ্ছে...";
  btn.disabled = true;

  // ১. LocalStorage থেকে ডাটা নেওয়া
  let pendingOrder = null;
  try {
    const rawData = localStorage.getItem('pendingOrderData');
    if (rawData) {
      pendingOrder = JSON.parse(rawData);
    }
  } catch(e) {}

  // ২. যদি LocalStorage এ না থাকে, তবে URL Parameter থেকে রিড করার চেষ্টা
  const urlParams = new URLSearchParams(window.location.search);
  const cusName = urlParams.get('cus_name') || (pendingOrder && pendingOrder.customer ? pendingOrder.customer.name : '');
  const paidAmount = urlParams.get('amount') || (pendingOrder ? pendingOrder.payAmount : '');

  // কাস্টমার অবজেক্ট তৈরি
  const customerData = (pendingOrder && pendingOrder.customer) ? pendingOrder.customer : {
    name: cusName || "Customer",
    mobile: urlParams.get('cus_phone') || "N/A",
    district: urlParams.get('district') || "N/A",
    address: urlParams.get('address') || "N/A"
  };

  const payloadData = {
    action: "SEND_TELEGRAM",
    customer: customerData,
    cartItems: pendingOrder ? pendingOrder.cartItems : [],
    productTotal: pendingOrder ? pendingOrder.productTotal : 0,
    deliveryCharge: pendingOrder ? pendingOrder.deliveryCharge : 0,
    totalAmount: pendingOrder ? pendingOrder.totalAmount : paidAmount,
    payAmount: paidAmount || (pendingOrder ? pendingOrder.payAmount : 0)
  };

  // Apps Script-এ রিকোয়েস্ট পাঠানো
  fetch("https://script.google.com/macros/s/AKfycbzx2vTmjA76dHDS2EDaeafutCcs0JWx1DlLF4uvzbjVM4-t1Km5jJA27Wylno90mJeorA/exec", {
    method: "POST",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify(payloadData)
  })
  .then(res => res.json())
  .then(data => {
    btn.innerText = "✓ এডমিনের কাছে সফলভাবে পাঠানো হয়েছে";
    btn.style.backgroundColor = "#28a745";
  })
  .catch(err => {
    alert("পাঠাতে সমস্যা হয়েছে, আবার চেষ্টা করুন।");
    btn.innerText = "আপনার অর্ডারটি এডমিনের কাছে পাঠান";
    btn.disabled = false;
  });
});
</script>

</body>
</html>
