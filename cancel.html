<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Cancelled | Mehndi By Fariha</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background: linear-gradient(135deg, #fce7f3 0%, #fbcfe8 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 40px rgba(219, 39, 119, 0.15);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 min-h-screen">
    <div class="glass-card max-w-md w-full rounded-3xl p-8 text-center space-y-6">
        <div class="w-20 h-20 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto text-4xl shadow-inner">
            <i class="fas fa-times-circle"></i>
        </div>

        <div class="space-y-2">
            <h2 class="text-2xl font-bold text-gray-800">অর্ডার বাতিল করা হয়েছে</h2>
            <p class="text-sm text-gray-600">আপনার পেমেন্ট সম্পন্ন হয়নি অথবা আপনি অর্ডারটি বাতিল করেছেন।</p>
        </div>

        <a href="index.html" class="block w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 rounded-xl shadow-lg transition">
            পুনরায় চেষ্টা করুন
        </a>
    </div>
</body>
</html>
